name: Validate Career Atlas

on:
  pull_request:
  push:
    branches:
      - main
      - feature/live-ilostat-data

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile data pipeline
        run: python -m py_compile scripts/update_career_atlas.py
      - name: Check dashboard JavaScript syntax
        run: node --check assets/app-heatmap-v2.js
