name: Update Career Atlas data

on:
  schedule:
    # Every Monday at 09:00 Thailand time (02:00 UTC)
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-atlas-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Fetch and rebuild snapshot from ILOSTAT
        run: python scripts/update_career_atlas.py

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/career_atlas_data.json; then
            echo "ILOSTAT returned no changes; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/career_atlas_data.json
          git commit -m "chore(data): refresh ILOSTAT Career Atlas snapshot"
          git push
